[project]
name = "eag-cognitive-agent"
version = "0.1.0"
description = "EAG V3 Session 6 — four-role cognitive agent (Memory, Perception, Decision, Action)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "mcp>=1.0",
    "ddgs>=7.0",
    "crawl4ai>=0.4",
    "tavily-python>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
